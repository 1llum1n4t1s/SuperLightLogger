name: Dependency validation

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dependency-validation-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    if: github.event_name == 'workflow_dispatch' || github.event.pull_request.user.login == 'dependabot[bot]'
    runs-on: windows-latest
    timeout-minutes: 45
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Setup .NET
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: |
            8.0.x
            10.0.x
      - name: Restore
        run: |
          dotnet restore SuperLightLogger.slnx
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Build
        run: |
          dotnet build SuperLightLogger.slnx -c Release --no-restore
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run existing regression tests
        run: |
          dotnet test --solution SuperLightLogger.slnx -c Release --no-build
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Run NativeAOT sample
        run: |
          $artifactRoot = Join-Path $env:RUNNER_TEMP 'superlightlogger-aot'
          $publishDir = Join-Path $artifactRoot 'publish'
          dotnet publish samples/AotSample/AotSample.csproj -c Release -r win-x64 --artifacts-path $artifactRoot -o $publishDir
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

          $sampleOutput = & (Join-Path $publishDir 'AotSample.exe')
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $sampleOutput
          if ($sampleOutput -notcontains 'AOT sample completed!') {
            throw 'AOTサンプルの完了表示がありません。'
          }

          $logs = @(Get-ChildItem -LiteralPath (Join-Path $publishDir 'logs') -Filter 'AotSample_*.log' -File)
          if ($logs.Count -eq 0) {
            throw 'AOTサンプルのログファイルがありません。'
          }
          # 日付境界でファイルが切り替わった場合も、今回のログ全体で確認する。
          $content = ($logs | ForEach-Object { Get-Content -LiteralPath $_.FullName -Raw -Encoding utf8 }) -join "`n"
          $expectedMessages = @(
            'Trace 出力', 'Debug 出力', 'Info 出力',
            'Warn 出力', 'Error 出力', 'Fatal 出力',
            '値=42, 値=hello',
            '例外発生',
            'ユーザー 12345 がログインしました'
          )
          foreach ($message in $expectedMessages) {
            if (-not $content.Contains($message)) {
              throw "AOTサンプルのログに期待する出力がありません: $message"
            }
          }
