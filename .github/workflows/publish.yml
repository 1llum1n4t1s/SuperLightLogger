name: Publish to NuGet

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'
  # やり直し専用: gh workflow run publish.yml --ref vx.y.z（タグ以外の ref は検証で失敗する）
  workflow_dispatch:

# サプライチェーン強化: GITHUB_TOKEN は最小権限 (リポジトリ既定への暗黙依存を排除)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$header"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = "http.$env:GITHUB_SERVER_URL/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $header"
          try {
            git fetch --force --tags origin $env:CHECKOUT_REF
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }

      # 公開は main の祖先 commit に付けた軽量タグ vx.y.z の Version からだけ行う。push / workflow_dispatch の
      # どちらでも必須にし、skip させない。NuGet は版番号を永久に予約するため、誤公開は不可逆。
      - name: Verify release tag and Version
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ($env:GITHUB_REF_TYPE -ne 'tag') { throw "This workflow must run on a 'vx.y.z' tag. Current ref: '$env:GITHUB_REF'." }
          if ($env:GITHUB_REF_NAME -notmatch '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$') { throw "Tag '$env:GITHUB_REF_NAME' is not a strict 'vx.y.z' tag." }
          if ($env:GITHUB_SHA -notmatch '^[0-9a-f]{40}$') { throw 'Unexpected GITHUB_SHA.' }
          $expectedVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          # 軽量タグで、いまもこの commit を指すこと
          $tagRef = gh api "repos/$($env:GITHUB_REPOSITORY)/git/ref/tags/$($env:GITHUB_REF_NAME)" --jq '.object.type + " " + .object.sha'
          if ($LASTEXITCODE) { throw 'Failed to read the tag ref.' }
          if ($tagRef -ne "commit $($env:GITHUB_SHA)") { throw "Tag is not a lightweight tag pointing at $($env:GITHUB_SHA) ($tagRef)." }
          # 既定ブランチの祖先であること（compare API）
          $default = gh api "repos/$($env:GITHUB_REPOSITORY)" --jq .default_branch
          if ($LASTEXITCODE -or -not $default) { throw 'Failed to read the default branch.' }
          $cmp = gh api "repos/$($env:GITHUB_REPOSITORY)/compare/$($env:GITHUB_SHA)...$($default)?per_page=1" --jq '.status + " " + (.behind_by | tostring)'
          if ($LASTEXITCODE) { throw 'Failed to compare with the default branch.' }
          if ($cmp -notin @('ahead 0', 'identical 0')) { throw "Tag commit is not an ancestor of '$default' ($cmp)." }
          $propsVersion = ([xml](Get-Content Directory.Build.props)).Project.PropertyGroup.Version
          if ($propsVersion -ne $expectedVersion) { throw "Directory.Build.props Version='$propsVersion' does not match tag 'v$expectedVersion'. Update <Version> before tagging." }
          Write-Host "Version OK: Directory.Build.props=$propsVersion matches tag v$expectedVersion"
          "expected_version=$expectedVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-dotnet'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/actions/setup-dotnet/0f4a354dd5547a28c70b7853dbd95d5b67886e73/externals/install-dotnet.ps1' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne '718A265CA5AE2ACEE0FC1E8B5146E32A8D535F8D666E3F7C875D9606C3753987') { throw 'Pinned .NET installer SHA-256 mismatch.' }
          & $installer -Channel 11.0 -InstallDir $installRoot -NoPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "DOTNET_ROOT=$installRoot" >> $env:GITHUB_ENV
          $installRoot >> $env:GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore SuperLightLogger.slnx

      - name: Build Release
        run: dotnet build SuperLightLogger.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SuperLightLogger.slnx -c Release --no-build

      - name: Pack SuperLightLogger
        run: dotnet pack src/SuperLightLogger/SuperLightLogger.csproj -c Release --no-build -o artifacts

      - name: Verify packed version matches release tag
        # タグ vx.y.z と pack した nupkg の版が一致しない場合は即座に失敗させ、NuGet 上の番号永久消費事故を防ぐ。
        # タグ・祖先・Directory.Build.props の照合は先頭の「Verify release tag and Version」で済んでいる。
        shell: pwsh
        run: |
          $tagVersion = $env:GITHUB_REF_NAME -replace '^v', ''
          if ($tagVersion -ne $env:expected_version) { throw "expected_version '$env:expected_version' とタグ '$env:GITHUB_REF_NAME' が一致しません。" }
          $expectedNupkg = "artifacts/SuperLightLogger.$tagVersion.nupkg"
          if (-not (Test-Path $expectedNupkg)) {
            $found = (Get-ChildItem -Path artifacts -Filter "*.nupkg" | ForEach-Object { $_.Name }) -join ', '
            throw "バージョン不一致: タグ '$env:GITHUB_REF_NAME' は $expectedNupkg を期待していますが、生成された nupkg: $found"
          }

      - name: Verify package payload before publishing
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          ./scripts/verify-release-package.ps1 -PackagePath "artifacts/SuperLightLogger.$version.nupkg" -Version $version

      - name: Authenticate to NuGet.org
        id: login
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NUGET_USER -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -or -not $env:ACTIONS_ID_TOKEN_REQUEST_URL) {
            throw 'NuGet user and GitHub OIDC permissions are required.'
          }
          Write-Output "::add-mask::$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          try {
            $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString('https://www.nuget.org'))"
            $oidc = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            if (-not $oidc.value) { throw 'Missing OIDC token.' }
            Write-Output "::add-mask::$($oidc.value)"
            $body = @{ username = $env:NUGET_USER; tokenType = 'ApiKey' } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri 'https://www.nuget.org/api/v2/token' -Headers @{ Authorization = "Bearer $($oidc.value)" } -ContentType 'application/json' -Body $body -StatusCodeVariable nugetStatusCode
            if ($nugetStatusCode -ne 200) { throw 'Unexpected NuGet token exchange status.' }
            if (-not $result.apiKey -or $result.apiKey -match '[\r\n]') { throw 'Missing or invalid NuGet API key.' }
            Write-Output "::add-mask::$($result.apiKey)"
            "NUGET_API_KEY=$($result.apiKey)" >> $env:GITHUB_OUTPUT
          } catch {
            throw 'NuGet Trusted Publishing authentication failed.'
          }

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if (-not $env:expected_version) {
            Write-Error 'expected_version is not set.'
            exit 1
          }
          $package = "artifacts\SuperLightLogger.$env:expected_version.nupkg"
          if (-not (Test-Path -LiteralPath $package)) {
            Write-Error "Expected package not found: $package"
            exit 1
          }
          $arguments = @(
            'nuget', 'push', $package,
            '--api-key', $env:NUGET_API_KEY,
            '--source', 'https://api.nuget.org/v3/index.json'
          )
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
