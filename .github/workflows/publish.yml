name: Publish to NuGet

on:
  push:
    branches:
      - 'release/**'
  workflow_dispatch:

# サプライチェーン強化: GITHUB_TOKEN は最小権限 (リポジトリ既定への暗黙依存を排除)
permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        shell: pwsh
        env:
          CHECKOUT_TOKEN: ${{ github.token }}
          CHECKOUT_REF: ${{ github.sha }}
        run: |
          $ErrorActionPreference = 'Stop'
          git init .
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          git remote add origin "$env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY.git"
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          $header = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("x-access-token:$env:CHECKOUT_TOKEN"))
          Write-Output "::add-mask::$header"
          $env:GIT_CONFIG_COUNT = '1'
          $env:GIT_CONFIG_KEY_0 = "http.$env:GITHUB_SERVER_URL/.extraheader"
          $env:GIT_CONFIG_VALUE_0 = "AUTHORIZATION: basic $header"
          try {
            git fetch --force --tags origin $env:CHECKOUT_REF
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
            git checkout --detach FETCH_HEAD
            if ($LASTEXITCODE) { exit $LASTEXITCODE }
          } finally {
            $env:GIT_CONFIG_COUNT = $null
            $env:GIT_CONFIG_KEY_0 = $null
            $env:GIT_CONFIG_VALUE_0 = $null
          }

      - name: Setup .NET
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $installRoot = Join-Path $env:RUNNER_TEMP 'release-dotnet'
          $installer = Join-Path $env:RUNNER_TEMP 'dotnet-install.ps1'
          Invoke-WebRequest 'https://raw.githubusercontent.com/actions/setup-dotnet/a98b56852c35b8e3190ac28c8c2271da59106c68/externals/install-dotnet.ps1' -OutFile $installer
          if ((Get-FileHash -LiteralPath $installer -Algorithm SHA256).Hash -ne 'B224982626C6DDF7CE915D7D560B7060D3C42754EB621F8CC53B8C775C0CC6B5') { throw 'Pinned .NET installer SHA-256 mismatch.' }
          & $installer -Channel 10.0 -InstallDir $installRoot -NoPath
          if ($LASTEXITCODE) { exit $LASTEXITCODE }
          "DOTNET_ROOT=$installRoot" >> $env:GITHUB_ENV
          $installRoot >> $env:GITHUB_PATH

      - name: Restore dependencies
        run: dotnet restore SuperLightLogger.slnx

      - name: Build Release
        run: dotnet build SuperLightLogger.slnx -c Release --no-restore

      - name: Run tests
        run: dotnet test SuperLightLogger.slnx -c Release --no-build

      - name: Pack SuperLightLogger
        run: dotnet pack src/SuperLightLogger/SuperLightLogger.csproj -c Release --no-build -o artifacts

      - name: Verify version matches release branch
        # ブランチ名 release/<version> と Directory.Build.props の <Version> が一致しない場合は
        # 即座にビルドを失敗させ、NuGet 上の番号永久消費事故を防ぐ
        if: startsWith(github.ref, 'refs/heads/release/')
        shell: pwsh
        run: |
          $branchVersion = "${{ github.ref_name }}" -replace '^release/', ''
          $expectedNupkg = "artifacts/SuperLightLogger.$branchVersion.nupkg"
          if (-not (Test-Path $expectedNupkg)) {
            $found = (Get-ChildItem -Path artifacts -Filter "*.nupkg" | ForEach-Object { $_.Name }) -join ', '
            throw "バージョン不一致: ブランチ '${{ github.ref_name }}' は $expectedNupkg を期待していますが、Directory.Build.props の <Version> が異なります。生成された nupkg: $found"
          }
          "expected_version=$branchVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Verify package payload before publishing
        shell: pwsh
        run: |
          [xml]$props = Get-Content -LiteralPath Directory.Build.props -Raw
          $version = [string]$props.Project.PropertyGroup.Version
          ./scripts/verify-release-package.ps1 -PackagePath "artifacts/SuperLightLogger.$version.nupkg" -Version $version

      - name: Authenticate to NuGet.org
        id: login
        shell: pwsh
        env:
          NUGET_USER: ${{ vars.NUGET_USER }}
        run: |
          $ErrorActionPreference = 'Stop'
          if (-not $env:NUGET_USER -or -not $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN -or -not $env:ACTIONS_ID_TOKEN_REQUEST_URL) {
            throw 'NuGet user and GitHub OIDC permissions are required.'
          }
          Write-Output "::add-mask::$env:ACTIONS_ID_TOKEN_REQUEST_TOKEN"
          try {
            $url = "$env:ACTIONS_ID_TOKEN_REQUEST_URL&audience=$([uri]::EscapeDataString('https://www.nuget.org'))"
            $oidc = Invoke-RestMethod -Uri $url -Headers @{ Authorization = "Bearer $env:ACTIONS_ID_TOKEN_REQUEST_TOKEN" }
            if (-not $oidc.value) { throw 'Missing OIDC token.' }
            Write-Output "::add-mask::$($oidc.value)"
            $body = @{ username = $env:NUGET_USER; tokenType = 'ApiKey' } | ConvertTo-Json -Compress
            $result = Invoke-RestMethod -Method Post -Uri 'https://www.nuget.org/api/v2/token' -Headers @{ Authorization = "Bearer $($oidc.value)" } -ContentType 'application/json' -Body $body -StatusCodeVariable nugetStatusCode
            if ($nugetStatusCode -ne 200) { throw 'Unexpected NuGet token exchange status.' }
            if (-not $result.apiKey -or $result.apiKey -match '[\r\n]') { throw 'Missing or invalid NuGet API key.' }
            Write-Output "::add-mask::$($result.apiKey)"
            "NUGET_API_KEY=$($result.apiKey)" >> $env:GITHUB_OUTPUT
          } catch {
            throw 'NuGet Trusted Publishing authentication failed.'
          }

      - name: Publish to NuGet
        env:
          NUGET_API_KEY: ${{ steps.login.outputs.NUGET_API_KEY }}
        run: |
          if ($env:expected_version) {
            $package = "artifacts\SuperLightLogger.$env:expected_version.nupkg"
            $skipDuplicate = $false
          } else {
            $matches = @(Get-ChildItem -Path artifacts -Filter 'SuperLightLogger.*.nupkg' -File)
            if ($matches.Count -ne 1) {
              Write-Error "Expected exactly one SuperLightLogger package, found $($matches.Count)."
              exit 1
            }
            $package = $matches[0].FullName
            $skipDuplicate = $true
          }
          if (-not (Test-Path -LiteralPath $package)) {
            Write-Error "Expected package not found: $package"
            exit 1
          }
          $arguments = @(
            'nuget', 'push', $package,
            '--api-key', $env:NUGET_API_KEY,
            '--source', 'https://api.nuget.org/v3/index.json'
          )
          if ($skipDuplicate) { $arguments += '--skip-duplicate' }
          & dotnet @arguments
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
        shell: pwsh
